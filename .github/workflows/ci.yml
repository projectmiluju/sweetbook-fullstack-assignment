name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — 테스트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

  web:
    name: Web — 린트 · 타입체크
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: 린트
        run: pnpm lint

      - name: 타입체크
        run: tsc -p tsconfig.json --noEmit
